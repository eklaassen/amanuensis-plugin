plugins:
  amanuensis_enabled:
    default: false
    client: true
    type: bool

  amanuensis_api_url:
    default: ""
    type: string

  amanuensis_api_secret:
    default: ""
    secret: true

  amanuensis_admin_key:
    default: ""
    secret: true

  amanuensis_viewing_group:
    default: ""
    type: string

  amanuensis_writing_group:
    default: ""
    type: string

  # Gates the speaker-relabel screen specifically -- a narrower, higher-trust
  # action than viewing/writing (it edits a meeting's stored transcript), so
  # it gets its own group rather than reusing amanuensis_writing_group.
  # Defaults to Discourse's own built-in "moderators" group (id 2) rather
  # than blank, so it's usable out of the box without the admin having to
  # configure anything first.
  amanuensis_relabel_speakers_group:
    default: "moderators"
    type: string
