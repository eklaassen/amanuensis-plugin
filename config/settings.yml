amanuensis_enabled:
  default: false
  client: true
  type: bool
  description: "Enable integration with the Amanuensis meeting archive API"

amanuensis_api_url:
  default: ""
  type: string
  description: "Amanuensis API base URL (e.g., https://api.example.com)"

amanuensis_api_secret:
  default: ""
  type: secret
  description: "API secret for reading meetings (PLUGIN_SECRET)"

amanuensis_admin_key:
  default: ""
  type: secret
  description: "Admin key for meeting ingestion (ADMIN_SECRET)"

amanuensis_viewing_group:
  default: ""
  type: string
  description: "Discourse group whose members can view meetings (leave blank for staff only)"
