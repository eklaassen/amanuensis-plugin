name: CI

on:
  # Run on every PR regardless of base branch so stacked PRs
  # (e.g. a specs PR targeting a fix branch) are also validated.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Conventional Commit
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -qE '^(feat|fix|chore|docs|style|refactor|perf|test|ci|build|revert)(\(.+\))?!?: .+$'; then
            echo "::error::PR title \"$TITLE\" does not follow conventional commit format"
            echo "Expected: type(scope): description  (add ! after type/scope for breaking changes)"
            echo "Types: feat fix chore docs style refactor perf test ci build revert"
            exit 1
          fi

  # Runs the plugin's RSpec suite inside a full Discourse host app, using
  # Discourse's official reusable workflow (checks out core, installs this
  # plugin into plugins/amanuensis, provisions Postgres + Redis, runs specs).
  plugin-tests:
    name: Plugin tests
    uses: discourse/.github/.github/workflows/discourse-plugin.yml@v1
    with:
      name: amanuensis
      # This repo has no Gemfile yet, so the reusable linting job (which runs
      # `bundle install` + rubocop) can't run. Wire up linting separately.
      skip_linting: true
