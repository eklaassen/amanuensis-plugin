name: CI

on:
  # Run on every PR regardless of base branch so stacked PRs
  # (e.g. a specs PR targeting a fix branch) are also validated.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Conventional Commit
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -qE '^(feat|fix|chore|docs|style|refactor|perf|test|ci|build|revert)(\(.+\))?!?: .+$'; then
            echo "::error::PR title \"$TITLE\" does not follow conventional commit format"
            echo "Expected: type(scope): description  (add ! after type/scope for breaking changes)"
            echo "Types: feat fix chore docs style refactor perf test ci build revert"
            exit 1
          fi

  contract-drift:
    # eklaassen/amanuensis is the source of truth for PLUGIN_CONTRACT
    # (amanuensis#229) -- spec/fixtures/plugin-api.v1.json here is a vendored
    # copy, not the original. This job re-fetches the real thing from
    # amanuensis's default branch and fails if the vendored copy has drifted,
    # the same "someone changed one side and not the other" check amanuensis's
    # own `contract` CI job runs against its emitted output.
    #
    # amanuensis is private, so this needs a read-scoped CONTRACT_SYNC_TOKEN
    # repo secret (a PAT with read access to eklaassen/amanuensis) -- add one
    # under Settings > Secrets and variables > Actions before this job can
    # pass. It will fail with a 404/401 from the API call until that secret
    # exists.
    name: Contract Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the current contract from amanuensis@develop
        env:
          GH_TOKEN: ${{ secrets.CONTRACT_SYNC_TOKEN }}
        run: |
          gh api repos/eklaassen/amanuensis/contents/contract/plugin-api.v1.json \
            --jq '.content' | base64 -d > /tmp/upstream-contract.json
      - name: Fail if the vendored fixture differs from amanuensis@develop
        run: diff spec/fixtures/plugin-api.v1.json /tmp/upstream-contract.json

  # Runs the plugin's RSpec suite inside a full Discourse host app, using
  # Discourse's official reusable workflow (checks out core, installs this
  # plugin into plugins/amanuensis, provisions Postgres + Redis, runs specs).
  plugin-tests:
    name: Plugin tests
    uses: discourse/.github/.github/workflows/discourse-plugin.yml@v1
    with:
      name: amanuensis
      # This repo has no Gemfile yet, so the reusable linting job (which runs
      # `bundle install` + rubocop) can't run. Wire up linting separately.
      skip_linting: true
