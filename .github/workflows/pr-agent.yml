name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [develop, main]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  describe:
    if: >
      github.event_name == 'pull_request' &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    name: Auto-describe PR
    concurrency:
      group: ${{ github.workflow }}-describe-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: PR Agent action step — describe
        id: pragent_describe
        uses: the-pr-agent/pr-agent@ffe1f89a4dafc7d8e88b9cf010a3233e30b49f43
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER.KEY: ${{ secrets.OPENROUTER_API_KEY_REVIEWS }}
          github_action_config.auto_describe: 'true'
          github_action_config.auto_improve: 'false'
          github_action_config.auto_review: 'false'

  review:
    if: >
      github.event_name == 'pull_request' &&
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.changed_files < 50
    runs-on: ubuntu-latest
    name: Auto-review PR
    concurrency:
      group: ${{ github.workflow }}-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: PR Agent action step — review
        id: pragent_review
        uses: the-pr-agent/pr-agent@ffe1f89a4dafc7d8e88b9cf010a3233e30b49f43
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER.KEY: ${{ secrets.OPENROUTER_API_KEY_REVIEWS }}
          github_action_config.auto_describe: 'false'
          github_action_config.auto_improve: 'false'
          github_action_config.auto_review: 'true'

  command:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.sender.type != 'Bot' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'eklaassen' &&
      (
        startsWith(github.event.comment.body, '/review') ||
        startsWith(github.event.comment.body, '/improve') ||
        startsWith(github.event.comment.body, '/describe') ||
        startsWith(github.event.comment.body, '/ask') ||
        startsWith(github.event.comment.body, '/update_changelog') ||
        startsWith(github.event.comment.body, '/add_docs') ||
        startsWith(github.event.comment.body, '/generate_labels') ||
        startsWith(github.event.comment.body, '/similar_issue') ||
        startsWith(github.event.comment.body, '/help')
      )
    runs-on: ubuntu-latest
    name: Run on-demand PR Agent command
    concurrency:
      group: ${{ github.workflow }}-command-${{ github.event.issue.number }}-${{ github.event.comment.id }}
      cancel-in-progress: false
    steps:
      - name: PR Agent action step — command
        id: pragent_command
        uses: the-pr-agent/pr-agent@ffe1f89a4dafc7d8e88b9cf010a3233e30b49f43
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER.KEY: ${{ secrets.OPENROUTER_API_KEY_REVIEWS }}
          github_action_config.auto_describe: 'false'
          github_action_config.auto_improve: 'false'
          github_action_config.auto_review: 'false'
